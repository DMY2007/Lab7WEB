<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Анкета</title>
</head>
<body bgcolor="white" text="black">
    <p align="center">
        <a href="DidenkoLab07-2.htm">Елементи форми</a> |
        <a href="DidenkoLab07-3.htm">Анкета</a> |
        <a href="DidenkoLab07-4.htm">Замовлення</a>
    </p>

    <form action="DidenkoLab07-result.htm" target="_blank" onsubmit="window.open(this.action, this.target); return false;">
        <table border="1" cellpadding="6" cellspacing="4" bgcolor="lightcyan">
            <tr>
                <th colspan="3"><h2><font color="red">Анкета</font></h2></th>
            </tr>
            <tr>
                <td>1.</td>
                <td><label for="surname">Прізвище</label></td>
                <td><input type="text" name="surname" id="surname" size="30"></td>
            </tr>
            <tr>
                <td>2.</td>
                <td><label for="name">Ім’я, по батькові</label></td>
                <td><input type="text" name="name" id="name" size="30"></td>
            </tr>
            <tr>
                <td>3.</td>
                <td><label for="birth">Число і рік народження</label></td>
                <td><input type="text" name="birth" id="birth" size="30"></td>
            </tr>
            <tr>
                <td>4.</td>
                <td><label for="address">Домашня адреса</label></td>
                <td><input type="text" name="address" id="address" size="30"></td>
            </tr>
            <tr>
                <td>5.</td>
                <td><label for="work">Місце навчання (роботи)</label></td>
                <td><input type="text" name="work" id="work" size="30"></td>
            </tr>
            <tr>
                <td>6.</td>
                <td><label for="phone">Домашній (робочий) телефон</label></td>
                <td><input type="text" name="phone" id="phone" size="30"></td>
            </tr>
            <tr>
                <td>7.</td>
                <td><label for="email">E-mail</label></td>
                <td><input type="text" name="email" id="email" size="30"></td>
            </tr>
            <tr>
                <td valign="top">8.</td>
                <td valign="top">Область наукових інтересів</td>
                <td>
                    <ol>
                        <li><input type="text" name="interest1" size="24" aria-label="Науковий інтерес 1"></li>
                        <li><input type="text" name="interest2" size="24" aria-label="Науковий інтерес 2"></li>
                        <li><input type="text" name="interest3" size="24" aria-label="Науковий інтерес 3"></li>
                        <li><input type="text" name="interest4" size="24" aria-label="Науковий інтерес 4"></li>
                        <li><input type="text" name="interest5" size="24" aria-label="Науковий інтерес 5"></li>
                        <li><input type="text" name="interest6" size="24" aria-label="Науковий інтерес 6"></li>
                    </ol>
                </td>
            </tr>
            <tr>
                <td colspan="3">
                    <input type="reset" value="Відмінити введення">
                    <p><input type="submit" value="Надіслати дані та перейти до 2 етапу реєстрації"></p>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
